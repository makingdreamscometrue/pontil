<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pontil : statistiques</title>
<style>
@font-face{font-family:Inter;src:url(polices/inter-latin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Newsreader;src:url(polices/newsreader-latin.woff2) format("woff2");font-weight:200 800}
:root{--fond:#000;--surface:#181818;--surface2:#1F1F1F;--trait:#272727;--texte:#F2F2F2;--doux:#B4B4B4;--pale:#9B9B9B;--ambre:#E8A33D;--violet:#A99BF0;--menthe:#5CC9A0;--rouge:#E5706B;--r:12px;--f-texte:Inter,system-ui,sans-serif;--f-titre:Newsreader,Georgia,serif}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.5 var(--f-texte);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
main{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:10px;font:500 24px/1 var(--f-titre);color:var(--texte);text-decoration:none}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r);background:var(--ambre)}
.logo svg{width:20px;height:20px}
#maj{color:var(--pale);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:18px 20px}
.kpi span{display:block;color:var(--doux);font-size:13px}
.kpi b{display:block;font:500 44px/1.05 var(--f-titre);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi small{color:var(--pale);font-size:13px}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:20px;margin-top:12px}
.bloc h2{font:600 15px/1.2 var(--f-texte);margin:0 0 14px}
.deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.deux .bloc{margin-top:0}
#courbe{width:100%;height:200px;display:block}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--trait)}
.ligne:first-of-type{border-top:0}
.ligne b{font-variant-numeric:tabular-nums}
.vide{color:var(--pale)}
#porte{text-align:center;padding:80px 16px;color:var(--doux)}
#porte a{color:var(--ambre)}
.graph{width:100%;height:220px;display:block}
.legende{display:flex;gap:16px;color:var(--doux);font-size:13px;margin:-6px 0 10px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.barre{padding:7px 0}
.barre-tete{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:6px}
.barre-tete b{font-variant-numeric:tabular-nums}
.barre-tete small{color:var(--pale);font-weight:400;margin-left:4px}
.barre i{display:block;height:8px;border-radius:4px}
a:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
</style>
</head>
<body>
<main>
 <header><a class="logo" href="./"><b><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v12M20 6v12M4 10c3 0 5 3 8 3s5-3 8-3"/></svg></b>Statistiques</a><span id="maj"></span></header>
 <div id="contenu"><p id="porte">Chargement...</p></div>
</main>
<script src="vendor/supabase.js"></script>
<script>
// Tableau de bord privé : la fonction SQL stats() ne répond qu'au compte du propriétaire (supabase/stats.sql)
const sb = supabase.createClient("https://ryvqymggtvosrijdxmzg.supabase.co", "sb_publishable_HzOqlGPtg9qhTVESavdHGw_ZLKp95f4");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nb = n => Number(n).toLocaleString("fr-FR");
let titres = {};

function liste(rows, nom = x => x) {
  return rows.length ? rows.map(([k, n]) => `<div class="ligne"><span>${esc(nom(k))}</span><b>${nb(n)}</b></div>`).join("") : '<p class="vide">Rien pour l\'instant.</p>';
}
const pc = r => r && r[1] ? Math.round(r[0] / r[1] * 100) + " %" : "-";
// Barres horizontales : libellé, nombre, part du maximum (entonnoir, fréquence)
function barres(rows, couleur = "var(--ambre)") {
  const max = Math.max(1, ...rows.map(r => r[1] || 0));
  return rows.map(([t, n, note]) => `<div class="barre"><div class="barre-tete"><span>${esc(t)}</span><b>${nb(n || 0)}${note ? ` <small>${note}</small>` : ""}</b></div><i style="width:${Math.max(n ? 2 : 0, (n || 0) / max * 100)}%;background:${couleur}"></i></div>`).join("");
}
// Parcours : de la visite à l'inscription, en part des visiteurs (30 jours)
function entonnoir(e) {
  const ET = [["visiteurs", "Arrivent sur le site"], ["note_1", "Notent un titre"], ["note_5", "Notent 5 titres"], ["recherche", "Cherchent un titre"],
    ["invite_vue", "Voient l'invitation au compte"], ["fenetre_compte", "Ouvrent « créer un compte »"], ["inscrit", "S'inscrivent"]];
  const base = e.visiteurs || 0;
  return barres(ET.map(([k, t]) => [t, e[k] || 0, base && k !== "visiteurs" ? Math.round((e[k] || 0) / base * 100) + " %" : ""]));
}
// Personnes différentes par jour sur 30 jours : nouvelles (ambre) + revenues (menthe) empilées
function personnes(rows) {
  const m = new Map(rows.map(([j, n, r]) => [j, [n, r]])), jours = [];
  for (let i = 29; i >= 0; i--) jours.push(new Date(Date.now() - i * 864e5).toLocaleDateString("sv-SE", {timeZone: "Europe/Paris"}));
  const max = Math.max(1, ...jours.map(j => (m.get(j) || [0])[0])), L = 1000, H = 220, l = L / 30, h = H - 46;
  const g = jours.map((j, i) => { const [n, r] = m.get(j) || [0, 0], hn = n / max * h, hr = r / max * h, x = i * l + 3, w = l - 6;
    return `<g><title>${j} : ${n} personne(s), dont ${r} revenue(s)</title>${n ? `<rect x="${x}" y="${H - 20 - hn}" width="${w}" height="${hn - hr}" rx="3" fill="#E8A33D"/>` : `<rect x="${x}" y="${H - 21}" width="${w}" height="1" fill="#272727"/>`}${r ? `<rect x="${x}" y="${H - 20 - hr}" width="${w}" height="${hr}" rx="3" fill="#5CC9A0"/>` : ""}${n ? `<text x="${x + w / 2}" y="${H - 26 - hn}" fill="#B4B4B4" font-size="13" text-anchor="middle">${n}</text>` : ""}</g>`; }).join("");
  const ax = [0, 14, 29].map(i => `<text x="${i * l + l / 2}" y="${H - 4}" fill="#9B9B9B" font-size="12" text-anchor="middle">${jours[i].slice(5).split("-").reverse().join("/")}</text>`).join("");
  return `<div class="legende"><span><i style="background:var(--ambre)"></i>Nouvelles</span><span><i style="background:var(--menthe)"></i>Revenues</span></div><svg class="graph" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="Personnes différentes par jour">${g}${ax}</svg>`;
}
// Barres des 30 derniers jours (visites), jours vides compris
function courbe(parJour) {
  const m = new Map(parJour.map(([j, n]) => [j, n])), jours = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5); jours.push(d.toLocaleDateString("sv-SE", {timeZone: "Europe/Paris"})); }
  const max = Math.max(1, ...jours.map(j => m.get(j) || 0)), L = 1000, H = 200, l = L / 30;
  const barres = jours.map((j, i) => { const n = m.get(j) || 0, h = Math.max(n ? 4 : 1, n / max * (H - 30));
    return `<rect x="${i * l + 3}" y="${H - 20 - h}" width="${l - 6}" height="${h}" rx="3" fill="${n ? "#E8A33D" : "#272727"}"><title>${j} : ${n} visite(s)</title></rect>`; }).join("");
  const ax = [0, 14, 29].map(i => `<text x="${i * l + l / 2}" y="${H - 4}" fill="#9B9B9B" font-size="12" text-anchor="middle">${jours[i].slice(5).split("-").reverse().join("/")}</text>`).join("");
  return `<svg id="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="Visites des 30 derniers jours">${barres}${ax}</svg>`;
}

// Clé secrète du propriétaire (lien #cle=... ouvert une fois) : gardée dans ce navigateur, retirée de l'adresse.
// Avec elle, pas besoin de se connecter (fonction SQL stats_cle) ; sinon, compte du propriétaire (stats).
let cle = null;
try { const m = location.hash.match(/cle=([0-9a-f]{20,})/); if (m) { localStorage.setItem("pontil-cle-stats", m[1]); history.replaceState(null, "", location.pathname); } cle = localStorage.getItem("pontil-cle-stats"); } catch (e) { /* stockage bloqué */ }

async function charger() {
  let s, error;
  if (cle) ({data: s, error} = await sb.rpc("stats_cle", {cle}));
  else {
    const {data: {session}} = await sb.auth.getSession();
    if (!session) { $("#contenu").innerHTML = '<p id="porte">Connecte-toi d\'abord sur <a href="./">pontil.fr</a>, puis reviens ici.</p>'; return; }
    ({data: s, error} = await sb.rpc("stats"));
  }
  if (error) { $("#contenu").innerHTML = '<p id="porte">Page réservée au propriétaire du site.</p>'; return; }
  // Catalogue compact (site.py) : une ligne par titre, [id, domaine, titre, ...]
  if (!Object.keys(titres).length) try { const c = await (await fetch("catalogue.json")).json(); for (const l of c.lignes || []) titres[l[0]] = l[2]; } catch (e) { /* noms bruts */ }
  $("#maj").textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
  $("#contenu").innerHTML = `
  <div class="kpis">
   <div class="kpi"><span>Visites aujourd'hui</span><b>${nb(s.visites_jour)}</b><small>${nb(s.visites_7j)} sur 7 jours</small></div>
   <div class="kpi"><span>Visites au total</span><b>${nb(s.visites)}</b><small>${s.visites ? Math.round(s.mobile / s.visites * 100) : 0} % sur téléphone</small></div>
   <div class="kpi"><span>Comptes créés</span><b>${nb(s.comptes)}</b><small>${nb(s.comptes_confirmes)} confirmés, ${nb(s.comptes_7j)} cette semaine</small></div>
   <div class="kpi"><span>Avis publiés</span><b>${nb(s.avis)}</b><small>${nb(s.profils)} profils synchronisés</small></div>
  </div>
  <div class="kpis" style="margin-top:12px">
   <div class="kpi"><span>Personnes aujourd'hui</span><b>${nb(s.uniques_jour)}</b><small>${nb(s.uniques_7j)} sur 7 jours, ${nb(s.uniques_30j)} sur 30</small></div>
   <div class="kpi"><span>Nouvelles cette semaine</span><b>${nb(s.nouveaux_7j)}</b><small>jamais venues avant</small></div>
   <div class="kpi"><span>Revenues</span><b>${nb(s.revenus_30j)}</b><small>au moins 2 jours sur 30</small></div>
   <div class="kpi"><span>Fidèles</span><b>${nb(s.fideles_7j)}</b><small>au moins 3 jours sur 7</small></div>
   <div class="kpi"><span>Reviennent le lendemain</span><b>${pc(s.retour_j1)}</b><small>${pc(s.retour_j7)} dans la semaine</small></div>
  </div>
  <div class="bloc"><h2>Visites des 30 derniers jours</h2>${courbe(s.par_jour)}</div>
  <div class="bloc"><h2>Personnes différentes par jour</h2>${personnes(s.uniques_par_jour || [])}</div>
  <div class="deux" style="margin-top:12px">
   <div class="bloc"><h2>Combien de jours chacun est venu</h2>${barres((s.frequence || []).map((n, i) => [["1 jour", "2 jours", "3 à 6 jours", "7 jours et plus"][i], n]), "var(--violet)")}</div>
   <div class="bloc"><h2>Où les gens s'arrêtent</h2>${entonnoir(s.entonnoir || {})}</div>
  </div>
  <div class="deux" style="margin-top:12px">
   <div class="bloc"><h2>D'où viennent les visiteurs</h2>${liste(s.origines)}</div>
   <div class="bloc"><h2>Page d'arrivée</h2>${liste(s.pages)}</div>
  </div>
  <div class="bloc"><h2>Titres les plus notés par les comptes</h2>${liste(s.notes, k => titres[k] || k)}</div>`;
}
charger();
setInterval(charger, 60000);  // l'appli reste ouverte : chiffres rafraîchis chaque minute
</script>
</body>
</html>
