:root{
 --fond:#0B0A08;--surface:#181818;--surface2:#1F1F1F;--trait:#272727;--trait2:#313131;
 --texte:#F2F2F2;--doux:#B4B4B4;--pale:#9B9B9B;
 --ambre:#E8A33D;--violet:#A99BF0;--menthe:#5CC9A0;--rouge:#E5706B;--bleu:#7FB0EA;
 --dom:var(--ambre);
 --ombre:0 18px 40px -14px color-mix(in srgb,var(--noir) 70%,transparent),0 2px 6px color-mix(in srgb,var(--noir) 35%,transparent);
 --sortie:cubic-bezier(.22,1,.36,1);
 --marge:clamp(16px,4vw,48px);

 --noir:#0B0A08;--blanc:#FBF9F5;--voile:rgb(11 10 8 / .5);--texte2:#DADADA;--pale2:#8A8A8A;--surface0:#131209;--surface3:#272727;--encre:#131209;
 --ombre:0 24px 48px -24px rgb(19 18 9 / .8);
 --r:12px;--r-petit:8px;
 --t-hero:clamp(40px,6vw,72px);--t-page:clamp(36px,4.5vw,60px);--t-page-long:clamp(30px,3.6vw,48px);--t-section:clamp(24px,2.4vw,30px);
 --f-titre:Inter,ui-sans-serif,system-ui,sans-serif;--f-texte:Inter,ui-sans-serif,system-ui,sans-serif;
}
main.serie{--dom:var(--violet)} main.jeu{--dom:var(--menthe)}
*{box-sizing:border-box}
html,body{overflow-x:clip}
[hidden]{display:none!important}
html{scrollbar-color:var(--trait2) var(--fond);-webkit-text-size-adjust:100%}
html{background:var(--fond)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 55% at 50% -10%,color-mix(in srgb,var(--texte) 7%,transparent),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,transparent 30%,color-mix(in srgb,var(--fond) 80%,transparent) 100%)}
body{margin:0;min-height:100vh;background:transparent;color:var(--texte);font:16px/1.55 var(--f-texte);letter-spacing:-.011em;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;caret-color:var(--ambre);display:flex;flex-direction:column}
::selection{background:color-mix(in srgb,var(--ambre) 38%,transparent);color:var(--blanc)}
::-webkit-scrollbar{width:10px;height:8px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--trait2);border-radius:var(--r);border:2px solid var(--fond)}
:focus-visible{outline:2px solid var(--ambre);outline-offset:3px;border-radius:var(--r)}
a{color:inherit;text-underline-offset:3px}
button{font-family:inherit}
svg{flex:none;fill:color-mix(in srgb,currentColor 16%,transparent)}

/* En-tête */
/* Barre façon Apple : translucide et floutée, liens en texte, aucune boîte */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fond) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--texte) 8%,transparent)}
.barre{max-width:1480px;margin:auto;padding:0 var(--marge);min-height:56px;display:flex;align-items:center;gap:32px}
.logo{display:flex;align-items:center;gap:9px;font:680 25px/1 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.02em;text-decoration:none;color:var(--texte);white-space:nowrap}
.logo{gap:0;font-weight:760;letter-spacing:-.045em}.logo .point{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:var(--ambre);margin-left:.08em;align-self:flex-end;margin-bottom:.16em}
.logo b svg{width:17px;height:17px;stroke-width:2.8}
nav{display:flex;gap:4px}
nav button{position:relative;background:none;border:0;color:var(--pale);font:500 14px var(--f-texte);letter-spacing:-.01em;padding:18px 12px;cursor:pointer;display:flex;align-items:center;transition:color .2s}
nav button{gap:8px} nav button svg{width:16px;height:16px;color:var(--dom-nav);opacity:.75;transition:opacity .2s} nav button.on svg,nav button:hover svg{opacity:1}
nav button::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--dom-nav,var(--texte));transform:scaleX(0);transition:transform .3s var(--sortie)}
nav button:hover{color:var(--texte)}
nav button.on{color:var(--texte)}
nav button.on::after{transform:scaleX(1)}
nav button[data-o="film"]{--dom-nav:var(--ambre)} nav button[data-o="serie"]{--dom-nav:var(--violet)} nav button[data-o="jeu"]{--dom-nav:var(--menthe)} nav button[data-o="gouts"]{--dom-nav:var(--rouge)}
.compte{margin-left:auto;font-size:12px;color:var(--doux);display:flex;align-items:center;gap:8px;white-space:nowrap}
.compte b{color:var(--texte);font-weight:600;font-variant-numeric:tabular-nums}

main{flex:1;min-height:100vh;width:100%;max-width:1480px;margin:auto;padding:0 var(--marge) 80px}

/* Grande affiche (meilleure reco) */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 8px}
.prop{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--texte) 3%,transparent);border:1px solid color-mix(in srgb,var(--texte) 7%,transparent)}
.prop::before{content:"";position:absolute;inset:-40px;z-index:-1;background:var(--img,none) center/cover;filter:blur(40px) saturate(1.2);opacity:.22}
.prop-aff{position:relative;display:block;align-self:start;aspect-ratio:2/3;border-radius:var(--r-petit);overflow:hidden;background:var(--surface2);box-shadow:0 14px 30px -12px var(--voile)}
.prop-aff img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.prop-aff .sans-image{font-size:13px;padding:10px;gap:6px}
.prop-texte{display:flex;flex-direction:column;gap:6px;min-width:0}
.prop-role{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px var(--f-texte);letter-spacing:.04em;text-transform:uppercase;color:var(--doux)}
.prop-role b{white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--texte);letter-spacing:0;font-variant-numeric:tabular-nums}
.prop h2{font:680 22px/1.15 var(--f-titre);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}.prop h2 a{color:inherit;text-decoration:none}.prop h2 a:hover{color:var(--dom)}
.prop small{color:var(--pale);font-size:13px}
.prop .pq{font-size:14px;line-height:1.45;margin:4px 0 0;color:var(--doux)}
.prop-act{display:flex;gap:6px;margin-top:auto;padding-top:8px}.prop-act .bt{padding:8px 10px}
@media(max-width:1000px){.trio{grid-template-columns:1fr;gap:10px}.prop{grid-template-columns:72px minmax(0,1fr);padding:12px}.prop h2{font-size:19px}.prop .pq{display:none}}
.scene{position:relative;margin:24px 0 8px;border-radius:var(--r);overflow:hidden;isolation:isolate;min-height:clamp(380px,52vh,560px);display:grid;grid-template-columns:1fr auto;align-items:end;gap:40px;padding:clamp(24px,4vw,56px)}
.scene::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,color-mix(in srgb,var(--noir) 94%,transparent) 0%,color-mix(in srgb,var(--noir) 70%,transparent) 45%,color-mix(in srgb,var(--noir) 15%,transparent) 100%),linear-gradient(0deg,color-mix(in srgb,var(--noir) 60%,transparent),transparent 40%)}
.scene::after,.fiche-tete::after{content:"";position:absolute;inset:-60px;z-index:-2;background:var(--img,none) center/cover;filter:blur(50px) saturate(1.05);opacity:.5}
.scene .affiche:hover{transform:rotate(0) scale(1.02)}
.scene .texte{max-width:640px;display:flex;flex-direction:column;gap:14px;animation:entre .9s var(--sortie) both}
.etiquette{align-self:flex-start;display:flex;align-items:center;gap:8px;font:600 12px var(--f-texte);color:var(--texte);padding:6px 13px 6px 10px;border-radius:var(--r);background:color-mix(in srgb,var(--texte) 8%,transparent);border:1px solid color-mix(in srgb,var(--texte) 10%,transparent);}
.actions.secondaires{margin-top:-4px;gap:4px;margin-left:-8px}
.avis-sel[data-n=adore]{background:var(--rouge);color:var(--fond);border-color:var(--rouge)}.avis-sel[data-n=aime],.avis-sel[data-n=regarde]{background:var(--menthe);color:var(--fond);border-color:var(--menthe)}.avis-sel[data-n=vu]{background:var(--bleu);color:var(--fond);border-color:var(--bleu)}
.bt.discret{background:none;border-color:transparent;color:var(--doux);padding-left:8px;padding-right:8px}.bt.discret:hover{color:var(--texte);background:color-mix(in srgb,var(--texte) 6%,transparent)}
a.etiquette{text-decoration:none;transition:border-color .2s}a.etiquette:hover{border-color:var(--ambre)}
.etiquette i{width:8px;height:8px;border-radius:50%;background:var(--dom);box-shadow:0 0 0 3px color-mix(in srgb,var(--dom) 25%,transparent)}
.scene h2{font:680 var(--t-page)/1 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.02em;margin:0;text-wrap:balance}
.scene h2.long{font-size:var(--t-page-long);line-height:1.05}
/* Affiche chargée : on masque le titre de secours (sinon il transparaît derrière les logos PNG) */
.scene h2 span{color:var(--doux);font-size:.5em;letter-spacing:0;margin-left:10px;font-variant-numeric:tabular-nums}
.scene .pq{font-size:16px;color:var(--texte2);max-width:56ch}
.scene .pq b{color:var(--blanc);font-weight:600}
.scene .affiche{display:block;position:relative;width:clamp(200px,24vw,340px);margin-right:clamp(0px,4vw,64px);transform:rotate(2deg);transition:transform .6s var(--sortie);aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -18px color-mix(in srgb,var(--noir) 90%,transparent),0 0 0 1px color-mix(in srgb,var(--texte) 8%,transparent);animation:monte 1s .1s var(--sortie) both;background:var(--surface2)}
@keyframes entre{from{opacity:0;transform:translateY(14px)}}
@keyframes monte{from{opacity:0;transform:translateY(24px) scale(.97)}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:var(--r-petit);background:color-mix(in srgb,var(--texte) 7%,transparent);color:var(--texte2);border:1px solid color-mix(in srgb,var(--texte) 6%,transparent)}
.chip.amb{background:transparent;color:var(--doux);border-color:color-mix(in srgb,var(--texte) 14%,transparent)}
.accroche{margin:0;font:600 12px var(--f-texte);color:var(--doux)}
.avis{font-size:12px;color:var(--menthe);font-variant-numeric:tabular-nums}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.bt{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--texte) 12%,transparent);background:color-mix(in srgb,var(--texte) 7%,transparent);color:var(--texte);font:600 14px var(--f-texte);cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .15s}
.bt svg{width:17px;height:17px}
.bt:hover{background:color-mix(in srgb,var(--texte) 13%,transparent)}
.bt:active{transform:scale(.96)}
.bt.plein{background:var(--texte);color:var(--fond);border-color:transparent}
.bt.plein:hover{background:var(--blanc)}

/* Sections */
.section{margin-top:52px}
.tete{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tete h2{font:680 var(--t-section)/1.1 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.01em;margin:0}
.rang{position:relative;isolation:isolate}
.fin-accueil{height:1px}
.rang .tete h2{display:flex;align-items:center;gap:12px} .rang .tete h2 svg{width:26px;height:26px;color:var(--dom-r)}
.rang-film{--dom-r:var(--ambre)} .rang-serie{--dom-r:var(--violet)} .rang-jeu{--dom-r:var(--menthe)}
.tete p{margin:0;color:var(--doux);font-size:14px;max-width:62ch}

/* Grille d'affiches */
.grille{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 22px}
.c img,.pop .cadre img{transition:transform .6s var(--sortie)} .c:hover .cadre img,.pop:hover .cadre img{transform:scale(1.05)}
.pop .cadre{transition:transform .35s var(--sortie),box-shadow .35s} .pop:hover .cadre{transform:translateY(-6px);box-shadow:0 24px 40px -18px var(--voile)}
@media(min-width:1380px){.grille{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1200px){.grille{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
.c{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.c.note{opacity:.3;pointer-events:none;transition:opacity .3s}
.cadre{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:color-mix(in srgb,var(--texte) 4%,transparent);transition:transform .45s var(--sortie),box-shadow .45s var(--sortie)}
.c:hover .cadre,.c:focus-within .cadre{transform:translateY(-5px);box-shadow:var(--ombre)}
.sans-image{position:absolute;inset:0;display:flex;flex-direction:column;gap:13px;padding:16px;overflow:hidden;font:680 20px/1.12 var(--f-titre);letter-spacing:-.025em;color:var(--texte);background:linear-gradient(var(--a,150deg),color-mix(in srgb,var(--dom) 38%,var(--surface2)),var(--surface2) 72%)}
.sans-image span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.sans-image svg{width:24px;height:24px;flex:none;color:var(--dom)}
.sans-image .filigrane{position:absolute;right:-22%;bottom:-12%;width:85%;height:auto;aspect-ratio:1;color:var(--dom);opacity:.13}
.aff-fiche .sans-image,.scene .affiche .sans-image,.tirage .sans-image{font-size:30px;padding:22px}
.affiche-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.affiche-img.ok{opacity:1}
/* Affiche en cours de chargement : fond neutre qui luit, pas la carte titre + icône (gardée si l'image manque) */
.sans-image:has(+ .affiche-img:not(.ok)){background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--texte) 6%,var(--surface2)) 50%,var(--surface2) 70%) 0 0/300% 100%;animation:luit 1.6s linear infinite}
.sans-image:has(+ .affiche-img:not(.ok)) > *{visibility:hidden}
@media (max-width:700px){.section{margin-top:34px}.tete h2,.rang .tete h2{font-size:21px}.rang .tete h2 svg{width:22px;height:22px}}
.affiche-img.logo{object-fit:contain;padding:18%;filter:drop-shadow(0 2px 6px var(--voile))}  /* jeux hors Steam : logo Wikimedia sur la tuile colorée */
.pct{position:absolute;z-index:2;top:10px;left:10px;display:flex;align-items:center;gap:6px;font:600 12px var(--f-texte);font-variant-numeric:tabular-nums;color:var(--blanc);padding:4px 9px 4px 8px;border-radius:var(--r-petit);background:color-mix(in srgb,var(--noir) 72%,transparent);border:1px solid color-mix(in srgb,var(--texte) 10%,transparent)}
.pct i{width:7px;height:7px;border-radius:50%;background:var(--dom)}
.mini-anneau{flex:none;width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--dom) calc(var(--p) * 1%),color-mix(in srgb,var(--texte) 22%,transparent) 0);-webkit-mask:radial-gradient(closest-side,transparent 52%,#000 56%);mask:radial-gradient(closest-side,transparent 52%,#000 56%)}
.legende .point-theme{color:hsl(var(--h) 65% 74%);text-decoration:none}.point-theme::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 5px 1px 0;vertical-align:middle}
html::before{content:"";position:fixed;inset:-120px;z-index:-2;pointer-events:none;background:var(--amb-survol,none) center/cover;filter:blur(110px) saturate(1.4);opacity:.18}
.fond-bande{position:absolute;z-index:-1;left:50%;top:50%;width:max(100%,178vh);aspect-ratio:16/9;min-height:100%;translate:-50% -50%;border:0;pointer-events:none;opacity:0;transition:opacity 1.2s}.fond-bande.v{opacity:.32}
::view-transition-group(affiche){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.barres-gouts{display:grid;gap:8px;margin-top:18px;max-width:420px}
.barres-gouts a{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;text-decoration:none;color:hsl(var(--h) 65% 74%);font:600 13px var(--f-texte)}
.barres-gouts span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barres-gouts i{height:8px;border-radius:99px;background:linear-gradient(90deg,hsl(var(--h) 65% 60%) var(--l),color-mix(in srgb,var(--texte) 8%,transparent) 0)}
.genres.pastilles{margin-top:14px}.genres.pastilles .chip{padding:6px 12px;border-radius:999px;font-size:14px;border:1px dashed color-mix(in srgb,var(--texte) 22%,transparent);background:none}
/* Survol : la raison et les avis apparaissent sur l'affiche */
.voile{position:absolute;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px;background:linear-gradient(transparent 25%,color-mix(in srgb,var(--noir) 94%,transparent) 78%);opacity:0;transition:opacity .3s var(--sortie)}
.c:hover .voile,.c:focus-within .voile{opacity:1}
.voile .mini-act{pointer-events:auto}
.couvre{position:absolute;inset:0;display:block;width:100%;padding:0;border:0;background:none;cursor:pointer}
.couvre:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
.c .pop-etat{display:block}
/* Avis : 4 choix posés sur l'affiche, du moins bon au meilleur */
.palette{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:8px;background:linear-gradient(transparent,color-mix(in srgb,var(--noir) 92%,transparent) 30%)}
.js .palette{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .18s var(--sortie),transform .25s var(--sortie),visibility 0s .25s}
.js .ouvert .palette,.js .mode .palette{opacity:1;visibility:visible;transform:none;transition:opacity .18s var(--sortie),transform .25s var(--sortie)}
/* Choix en verre dépoli, sans bordure (feuille d'actions façon iOS) */
.palette>*{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 10px;border-radius:9px;border:0;background:color-mix(in srgb,var(--texte) 12%,transparent);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);color:var(--blanc);white-space:nowrap;font:500 13px/1.1 var(--f-texte);text-align:left;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.palette svg{width:15px;height:15px;flex:none;opacity:.9}
@media(max-width:480px){.palette{gap:3px;padding:5px}.palette>*{min-height:29px;padding:0 6px;gap:5px}.palette svg{width:14px;height:14px}}
.palette button:active{transform:scale(.96)}
.palette button:focus-visible{outline:2px solid var(--ambre);outline-offset:1px}
.palette [data-v="bof"]:hover,[data-n="bof"] .palette [data-v="bof"]{background:var(--trait2)}
.palette [data-v="vu"]:hover,[data-n="vu"] .palette [data-v="vu"]{background:var(--bleu);color:var(--fond)}
.palette [data-v="aime"]:hover,[data-n="aime"] .palette [data-v="aime"]{background:var(--menthe);color:var(--fond)}
.palette [data-v="adore"]:hover,[data-n="adore"] .palette [data-v="adore"],.palette .choisi{background:var(--rouge);color:var(--fond)}
.coche:empty{display:none}
.c .coche,.pop .coche{position:absolute;z-index:2;top:8px;right:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--fond);opacity:1;transform:none;border:0}
.coche svg{width:16px;height:16px}
[data-n="aime"] .coche{background:var(--menthe)} [data-n="adore"] .coche{background:var(--rouge);color:var(--fond)} [data-n="vu"] .coche{background:var(--bleu)} [data-n="bof"] .coche{background:var(--trait2);color:var(--blanc)}
[data-n="aime"] .cadre{box-shadow:0 0 0 3px var(--menthe)} [data-n="adore"] .cadre{box-shadow:0 0 0 3px var(--rouge)} [data-n="vu"] .cadre{box-shadow:0 0 0 3px var(--bleu)}
[data-n="bof"] .couvre{opacity:.4}
[data-n="aime"] .pop-etat{color:var(--menthe)} [data-n="adore"] .pop-etat{color:var(--rouge)} [data-n="vu"] .pop-etat{color:var(--bleu)}
#main.entre>*{animation:monte .42s var(--sortie) both}
#main.entre>*:nth-child(2){animation-delay:.05s} #main.entre>*:nth-child(3){animation-delay:.1s}
h1,h2,h3,.mode li b{font-weight:500;letter-spacing:-0.02em;text-wrap:balance}
.accueil h1{color:var(--blanc)}
.accueil h1 em{font-style:normal;color:var(--ambre);-webkit-text-fill-color:var(--ambre)}
.legende .titre,.pop-titre{font-weight:500;letter-spacing:-0.01em}
p{text-wrap:pretty}
@media(prefers-reduced-motion:reduce){.palette{transition:none;transform:none}#main.entre>*,.fond-recherche,.fond-recherche .panneau-recherche{animation:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.pct,a.moy{text-decoration:none;color:var(--blanc);transition:background .15s,border-color .15s}
a.pct:hover,a.moy:hover{background:color-mix(in srgb,var(--noir) 95%,transparent);border-color:color-mix(in srgb,var(--texte) 35%,transparent)}
a.chip{text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
a.chip:hover{background:color-mix(in srgb,var(--texte) 14%,transparent);border-color:color-mix(in srgb,var(--texte) 28%,transparent);color:var(--blanc)}
a.accroche{text-decoration:none;align-self:flex-start}
a.accroche:hover{color:var(--texte)}
.pq a,.parce a,.legende span a,.type-fiche a,.score a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--texte) 28%,transparent);text-underline-offset:3px}
.legende span a,.legende em a{text-decoration:none}
.legende span a:hover,.legende em a:hover{text-decoration:underline}
.pq a:hover,.parce a:hover,.legende span a:hover,.type-fiche a:hover,.score a:hover{color:var(--texte);text-decoration-color:currentColor}
.scene .pq a,.parce a{color:var(--blanc);font-weight:600}
.voile .pq{font-size:12px;line-height:1.4;color:var(--texte2)}
.voile .pq b{color:var(--blanc);font-weight:600}
.mini-act{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.mini-act button,.mini-act a{display:grid;place-items:center;height:36px;border-radius:var(--r-petit);border:1px solid color-mix(in srgb,var(--texte) 14%,transparent);background:color-mix(in srgb,var(--texte) 8%,transparent);color:var(--blanc);cursor:pointer;transition:background .15s,color .15s,transform .15s}
.mini-act button svg,.mini-act a svg{width:16px;height:16px}
.mini-act button,.mini-act a{min-width:0;padding:0}
.mini-act button:active{transform:scale(.92)}
.mini-act .a1:hover{background:var(--rouge)} .mini-act .a2:hover{background:var(--menthe);color:var(--fond)} .mini-act .a3:hover{background:var(--bleu);color:var(--fond)} .mini-act .a4:hover{background:var(--trait2)} .mini-act .a5:hover{background:var(--ambre);color:var(--fond)}
.legende{display:flex;flex-direction:column;gap:2px;padding:0 2px}
.legende .titre,.tirage h3 .titre,.scene h2 a{color:inherit;text-decoration:none;cursor:pointer}.legende .titre:focus-visible,.tirage h3 .titre:focus-visible{outline:2px solid var(--ambre);outline-offset:2px;border-radius:var(--r)}
.cadre,.affiche{cursor:pointer}
.moy{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r);background:color-mix(in srgb,var(--noir) 78%,transparent);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.moy svg{width:13px;height:13px;color:var(--ambre);fill:var(--ambre)}
.tete .tri{display:inline-flex;margin-top:14px}
.legende .titre{padding:2px 0;font:680 16px/1.25 var(--f-titre);letter-spacing:-.025em;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legende .titre:hover,.tirage h3 .titre:hover,.scene h2 a:hover{color:var(--dom)}
.legende span{font-size:12px;color:var(--pale);font-variant-numeric:tabular-nums;}
.legende .pq{margin:2px 0 0;font-size:12px;line-height:1.35;color:var(--doux)}
.legende .pq span,.legende .pq a{font:inherit;text-transform:none;letter-spacing:0;color:inherit}
.legende em{font-style:normal;font-size:12px;line-height:1.3;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:none){.voile{opacity:1;background:linear-gradient(transparent 55%,color-mix(in srgb,var(--noir) 92%,transparent))}.mini-act button,.mini-act a{height:32px}}

/* Accueil (premier passage, version site) */
.accueil{position:relative;margin:24px 0 0;border-radius:var(--r);overflow:hidden;isolation:isolate;padding:clamp(36px,7vw,96px) clamp(24px,5vw,72px);-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);min-height:clamp(420px,60vh,620px);display:flex;flex-direction:column;justify-content:center}
.mur{position:absolute;inset:-10%;z-index:-2;display:grid;grid-template-columns:repeat(8,1fr);gap:13px;transform:rotate(-8deg) scale(1.15);opacity:.85;animation:defile 28s linear infinite alternate}
.accueil .actions .bt:not(.plein){background:color-mix(in srgb,var(--surface) 92%,transparent)}
.mur .tuile{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.mur .sans-image{font-size:16px;padding:13px}
@keyframes defile{to{transform:rotate(-8deg) scale(1.15) translateY(-12%)}}
.accueil::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 120% at 0% 50%,color-mix(in srgb,var(--noir) 97%,transparent) 32%,color-mix(in srgb,var(--noir) 70%,transparent) 58%,color-mix(in srgb,var(--noir) 15%,transparent))}
.accueil h1{font:680 var(--t-hero)/.98 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.025em;margin:0 0 20px;max-width:12ch}
.accueil h1 em{font-style:normal;color:var(--ambre)}
.accueil p{font-size:18px;color:var(--texte2);max-width:52ch;margin:0 0 28px}
.preuves{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;color:var(--doux);font-size:14px}
.preuves span{display:flex;align-items:center;gap:8px}
.preuves svg{width:16px;height:16px;color:var(--ambre)}

/* Démarrage rapide */
.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x proximity;scrollbar-width:none} .rail::-webkit-scrollbar{display:none}
.pop{flex:none;width:clamp(160px,15vw,236px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.pop-note{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;border-radius:var(--r)}
.pop-titre{font-size:14px;font-weight:500;color:var(--texte);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-titre:hover{text-decoration:underline;text-underline-offset:3px}
.pop-etat{min-height:18px;font-size:12px;font-weight:600;color:var(--pale)}
.pop[data-n="aime"] .pop-etat{color:var(--menthe)} .pop[data-n="adore"] .pop-etat{color:var(--rouge)}
.rail.glisse{scroll-snap-type:none;cursor:grabbing;user-select:none}
.rail.glisse *{pointer-events:none}
.rail-fleche{position:absolute;top:calc(50% - 40px);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--trait);background:var(--surface);color:var(--texte);font-size:22px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s;display:none}
.rail-fleche.g{left:-6px} .rail-fleche.d{right:-6px}
/* invisibles, elles ne doivent pas capter les touchers (au doigt : pas de flèches) */
@media (hover:hover){.rail-fleche{display:block} .rail-boite:hover .rail-fleche:not([hidden]){opacity:.92;pointer-events:auto}}
.rail-boite{position:relative}
.rail-cartes .c{flex:none;width:clamp(150px,40vw,190px);scroll-snap-align:start}
/* Accueil en grilles (les rangées qui défilent sur le côté étaient pénibles) : 12 titres, puis « Voir plus » */
#choix .rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 14px;overflow:visible;scroll-snap-type:none}
#choix .rail > *{width:auto}
#choix .rail:not(.tout) > :nth-child(n+13){display:none}
.voir-plus{display:block;margin:6px auto 0;background:none;border:1px solid var(--trait);color:var(--texte);border-radius:999px;padding:10px 22px;font:600 15px var(--f-texte);cursor:pointer}
.voir-plus:hover{border-color:var(--texte2)}
@media (max-width:1000px){#choix .rail{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){#choix .rail{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}#choix .pop-titre{font-size:13px}}
.palette .vers-fiche{margin-top:4px;background:var(--texte);color:var(--fond);justify-content:center;font-weight:650}
.palette .vers-fiche svg{width:14px;height:14px}
.bulle-geste{position:absolute;left:8px;right:8px;top:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:12px;background:var(--ambre);color:var(--fond);font:500 13px var(--f-texte);box-shadow:0 10px 30px -8px rgba(0,0,0,.6);animation:monte .35s var(--sortie) both}
.bulle-geste b{font-weight:750}
.rang .tete{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.astuce-titre{color:var(--doux);font-size:14px}.astuce-titre b{color:var(--texte);font-weight:650}
@media (max-width:700px){.bulle-geste{display:none}.progres{gap:10px;padding:10px 10px 10px 16px}.progres small{white-space:normal;font-size:12.5px;line-height:1.3}.progres #voir{white-space:nowrap;flex:none;padding:10px 14px}}
@media (max-width:700px){#choix .palette{gap:3px;padding:6px}#choix .palette button{padding:4px 7px;font-size:11.5px;min-height:0;gap:5px}#choix .palette button svg{width:12px;height:12px}}
.aide-rail{margin:24px 0 0;color:var(--doux);font-size:14px}
/* Mode d'emploi sans carte : un trait fin, trois étapes numérotées, légendes neutres */
.mode{margin-top:72px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,80px);align-items:center;padding:48px 0 8px;border-top:1px solid color-mix(in srgb,var(--texte) 8%,transparent)}
.mode p{margin:0;color:var(--pale);font-size:17px;line-height:1.5;max-width:34ch}
@media(max-width:760px){.mode{grid-template-columns:1fr}}
.mode h3{font:680 clamp(30px,3.4vw,44px)/1.05 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.02em;margin:0 0 16px}
.mode ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,160px));gap:clamp(14px,3vw,32px);counter-reset:etape}
.mode li{display:flex;flex-direction:column;gap:6px;min-width:0}
.mode .cadre{margin-bottom:10px;cursor:default;border-radius:10px;box-shadow:0 20px 40px -20px var(--voile)}
.mode .m2 .cadre{box-shadow:0 0 0 2px var(--ambre),0 20px 40px -20px var(--voile)}
.mode .marque{position:absolute;z-index:2;top:8px;right:8px;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--fond)}
.mode .marque svg{width:17px;height:17px}
.mode .m1 .marque{background:var(--menthe)} .mode .m2 .marque{background:var(--ambre);color:var(--fond)}
.mode li b{font:680 24px/1 var(--f-titre);letter-spacing:-.025em}
.mode li>span{font-size:14px;font-weight:500;color:var(--doux);counter-increment:etape;display:flex;gap:8px;align-items:baseline}
.mode li>span::before{content:counter(etape);font:680 18px/1 var(--f-titre);letter-spacing:-.025em;color:var(--pale)}

.pop:hover .cadre{transform:translateY(-4px)}
/* Barre visible dès l'arrivée : elle dit à quoi servent les 5 titres */
.progres{transition:opacity .35s var(--sortie),transform .45s var(--sortie);position:sticky;bottom:18px;z-index:10;margin:28px auto 0;width:min(560px,100%);display:flex;align-items:center;gap:16px;padding:13px 13px 13px 20px;border-radius:var(--r);background:color-mix(in srgb,var(--surface2) 90%,transparent);box-shadow:var(--ombre)}
.progres .barre-p{flex:1;height:6px;border-radius:var(--r);background:var(--trait);overflow:hidden}
.progres .barre-p i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--ambre),var(--rouge));border-radius:var(--r);transition:transform .4s var(--sortie)}
.progres small{color:var(--doux);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.progres .bt[disabled]{background:transparent;color:var(--doux);border-color:var(--trait);cursor:not-allowed;opacity:.45}
.progres small{color:var(--texte);font-weight:600}
.progres small.pulse{animation:pulse .5s var(--sortie)}
@keyframes pulse{40%{transform:scale(1.15);color:var(--ambre)}}
.scene .texte,.scene .affiche{animation-duration:.35s;animation-delay:0s}

/* Mes goûts */
.colonnes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;margin-top:28px;align-items:start}
.panneau{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:24px}
.panneau h2{font:680 24px/1.1 var(--f-titre);letter-spacing:-.025em;margin:0 0 6px}
.panneau .aide{color:var(--doux);font-size:14px;margin:0 0 16px}
.panneau + .panneau{margin-top:20px}
.champ{position:relative}
.champ svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--pale)}
.champ input{width:100%;background:var(--fond);border:1px solid var(--trait2);color:var(--texte);font:14px var(--f-texte);padding:13px 14px 13px 42px;border-radius:var(--r);outline:none;transition:border-color .15s,box-shadow .15s}
.champ input::placeholder{color:var(--pale)}
.champ input:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
.lignes{display:flex;flex-direction:column;gap:6px}
#res:not(:empty){margin-top:13px}
.l{display:flex;align-items:center;gap:13px;padding:7px 8px;border-radius:var(--r);transition:background .15s}
.l:hover{background:color-mix(in srgb,var(--texte) 4%,transparent)}
.l .mini{width:38px;height:56px;border-radius:var(--r);background:color-mix(in srgb,var(--dom) 16%,var(--surface2));flex:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--texte) 6%,transparent);display:grid;place-items:center}
.l .mini svg{width:18px;height:18px;color:var(--dom)}
.l .nom{flex:1;min-width:0;font-weight:500;line-height:1.3}
.l .nom a{color:var(--texte);text-decoration:none}.l .nom a:hover{text-decoration:underline;text-underline-offset:3px}
a.mini{display:block}
.l .nom small{display:block;font-weight:400;font-size:12px;color:var(--pale)}
.l select{background:var(--surface2);color:var(--texte);border:1px solid var(--trait2);border-radius:var(--r);padding:7px 9px;font:12px var(--f-texte);cursor:pointer;max-width:150px}
.l .h{font-size:12px;color:var(--pale);white-space:nowrap}
.depot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 20px;text-align:center;border:1.5px dashed var(--trait2);border-radius:var(--r);color:var(--doux);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.depot svg{width:24px;height:24px;color:var(--ambre)}
.depot strong{color:var(--texte);font-weight:600}
.depot:hover,.depot.sur{border-color:var(--ambre);color:var(--texte);background:color-mix(in srgb,var(--ambre) 5%,transparent)}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
#bilan{margin-top:13px;font-size:14px;color:var(--menthe)}
.outils{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.outils .bt{padding:8px 13px;font-size:12px;font-weight:500}
.liste-gouts{max-height:640px;overflow-y:auto;margin:0 -8px;padding:0 8px}
.filtres{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.filtres-recos .filtres{margin-bottom:0}
.filtres button{background:none;border:1px solid var(--trait2);color:var(--doux);font:500 12px var(--f-texte);padding:5px 13px;border-radius:var(--r);cursor:pointer}
.filtres button svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.legende .duree,.legende .gratuit{font:inherit;margin-left:10px;white-space:nowrap;display:inline-block}
.legende>span:first-of-type{display:flex;flex-wrap:wrap;column-gap:10px;row-gap:2px}
.legende>span:first-of-type .duree,.legende>span:first-of-type .gratuit{margin-left:0}
.legende .duree svg{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.legende .gratuit{color:var(--menthe)}
.filtres button.on{background:var(--texte);color:var(--fond);border-color:transparent}

/* États */
.liste-vide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(24px,4vw,48px);border-radius:var(--r);background:var(--surface);border:1px solid var(--trait)}
.liste-vide h4{font:680 var(--t-section)/1.1 var(--f-titre);letter-spacing:-.025em;letter-spacing:-.02em;margin:0 0 8px}
.liste-vide p{margin:0 0 20px;color:var(--doux);font-size:16px}
.liste-vide .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;padding:8px 14px}
.liste-vide .chip svg{width:14px;height:14px}
.eventail{position:relative;width:260px;height:190px}
.eventail i{position:absolute;bottom:0;left:50%;width:104px;aspect-ratio:2/3;border-radius:var(--r-petit);overflow:hidden;background:var(--surface2);box-shadow:0 18px 36px -12px color-mix(in srgb,var(--noir) 90%,transparent),0 0 0 1px color-mix(in srgb,var(--texte) 10%,transparent);transform-origin:50% 120%;transition:transform .5s var(--sortie)}

<noscript><h1>Pontil : films, séries et jeux vidéo, reliés</h1><p>Tu as aimé un film ? Voici le jeu. Un jeu ? Voici la série. Pontil recommande gratuitement des films, des séries et des jeux vidéo en expliquant pourquoi.</p><h3>Qu'est-ce que Pontil ?</h3><p>Pontil est un site gratuit de recommandations qui relie les films, les séries et les jeux vidéo : tu notes ce que tu as aimé, il te propose des titres des trois mondes en expliquant pourquoi.</p><h3>Pontil est-il gratuit ?</h3><p>Oui, entièrement gratuit et sans publicité. Le compte est optionnel et sert seulement à retrouver tes notes sur tous tes appareils.</p><h3>Comment Pontil choisit-il les recommandations ?</h3><p>Chaque titre est décrit par ses thèmes (Wikidata, Steam). Les thèmes rares pèsent plus que les thèmes courants, puis Pontil compare ces thèmes à ceux des titres que tu as aimés et ajuste avec la note critique.</p><h3>Quel jeu vidéo jouer après un film que j'ai aimé ?</h3><p>Note le film sur Pontil : il propose des jeux qui partagent ses thèmes, par exemple des jeux d'horreur ou de survie après un film d'horreur, avec la raison et la boutique où l'acheter.</p><h3>Combien de titres contient Pontil ?</h3><p>Plus de 28 000 films, séries et jeux vidéo.</p><p><a href="catalogue/">Tous les films, séries et jeux</a></p><p>Contact : contact@pontil.fr</p></noscript>

<script>
let onglet = "film", data = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = n => `<svg aria-hidden="true"><use href="#${n}"/></svg>`;

const ICONE = {film:"film", serie:"tv", jeu:"manette"};
const TEXTE = {adore:"J'adore", aime:"J'aime", regarde:"Regardé", vu:"Sans plus", bof:"Non merci", deteste:"Détesté"};
const VERBE = {film:"vu", serie:"vu", jeu:"joué"};

const poster = (url, corps) => fetch(url,{method:"POST",headers:{"X-Recos":"1"},body:JSON.stringify(corps)});
const json = async url => (await fetch(url)).json();
// Même page pour les deux versions : serveur local (recos.py) ou site sans serveur (moteur.js, profil dans le navigateur)
const WEB = typeof Moteur !== "undefined";
const api = WEB ? {
 recos: async n => Moteur.recos(n), gouts: async () => Moteur.gouts(), cherche: async q => Moteur.cherche(q),
 noter: async (id, note) => Moteur.noter(id, note),
 fiche: async id => Moteur.fiche(id), liste: async q => Moteur.liste(q), titres: async ids => Moteur.titres(ids),

} : {
 recos: () => json("/api/recos"), gouts: () => json("/api/gouts"), cherche: q => json("/api/cherche?q="+encodeURIComponent(q)),
 noter: (id, note) => poster("/api/note",{id,note}),
 fiche: id => json("/api/fiche?id="+encodeURIComponent(id)),
 titres: ids => json("/api/titres?ids="+ids.map(encodeURIComponent).join(".")),
 liste: q => json(`/api/liste?themes=${encodeURIComponent((q.themes || []).join("|"))}&annee=${q.annee || ""}&tri=${q.tri || ""}`),
 importer: async (nom, texte) => (await poster("/api/import",{nom, texte})).json(),
};
function toast(t, annuler){const e=$("#toast");e.innerHTML=ico("ok")+esc(t);if(annuler){const b=document.createElement("button");b.textContent="Annuler";b.onclick=()=>{e.classList.remove("v");annuler();};e.append(b);}e.classList.add("v");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("v"),annuler?4500:1900)}
// Wikipédia dans la langue affichée (r.wiki = article anglais, connu depuis Wikidata)
function lien(r){return r.steam?`https://store.steampowered.com/app/${r.steam}`:enAnglais()?(r.wiki?`https://en.wikipedia.org/wiki/${r.wiki}`:`https://en.wikipedia.org/wiki/Special:Search/${encodeURIComponent(r.titre)}`):`https://fr.wikipedia.org/wiki/Special:Search/${encodeURIComponent(r.titre)}`}
// Vraie affiche (jaquette verticale Steam pour les jeux), posée sur une couverture dessinée qui sert de repli
// tant qu'elle charge ou si elle manque : icône du support, titre, teinte du support.
const TEINTE = {film:"var(--ambre)", serie:"var(--violet)", jeu:"var(--menthe)"};
// Variation stable par titre (angle du dégradé), pour que deux couvertures voisines ne se ressemblent pas
const angle = id => 120 + [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 7) % 100;
const visuel = r => r.dom === "jeu" && r.steam ? `https://cdn.akamai.steamstatic.com/steam/apps/${r.steam}/library_600x900.jpg` : r.image;
const repli = r => r.dom === "jeu" && r.image ? `this.onerror=()=>this.remove();this.src='${esc(r.image)}'` : "this.remove()";
const affiche = (r, charge = "lazy") => visuel(r) ? `<img class="affiche-img${/\.svg\//.test(visuel(r)) ? " logo" : ""}" src="${esc(visuel(r))}" loading="${charge}" alt="" onload="this.classList.add('ok')" onerror="${repli(r)}">` : "";
const couverture = (r, charge) => `<div class="sans-image" style="--dom:${TEINTE[r.dom]};--a:${angle(r.id)}deg">${ico(ICONE[r.dom])}<span>${esc(r.titre)}</span><svg class="filigrane" aria-hidden="true"><use href="#${ICONE[r.dom]}"/></svg></div>${affiche(r, charge)}`;
// Ambiances à la Letterboxd : des combinaisons de thèmes décrites en une phrase (affichage seulement)

 [["Coop entre amis"], "À jouer à plusieurs"],
 [["Thriller, mystère"], "Suspense et mystères"],
 [["Comédie"], "Pour rire un bon coup", 1],
 [["Histoire forte"], "Des histoires qui marquent", 1],
];
// 1 = repli, seulement si rien de plus précis ne s'applique
const ambiances = (themes = [], n = 3) => {
 const l = AMBIANCES.filter(([k]) => k.every(t => themes.includes(t)));
 const precis = l.filter(a => !a[2]);
 return (precis.length ? precis : l).slice(0, n).map(a => a[1]);
};
// Tout titre, thème, ambiance ou année affiché est un lien : vers sa fiche ou vers la liste correspondante
const lienListe = (type, v) => `#/${type}/${encodeURIComponent(v)}`;
const lienTitre = x => `<a href="${lienFiche(x)}">${esc(x.titre)}</a>`;
const raisons = (r, cls = "pq") => r.parce_que.length ? `<p class="${cls}">Parce que tu as aimé ${r.parce_que.map(lienTitre).join(" et ")}</p>` : "";
const lienAnnee = a => a ? `<a href="${lienListe("annee", a)}">${a}</a>` : "";

// ---------- Où regarder, où jouer (disponibilites.py) ----------
const BOUTIQUES = {steam: ["Steam", id => `https://store.steampowered.com/app/${id}`], gog: ["GOG", id => `https://www.gog.com/${encodeURI(id)}`],
 epic: ["Epic Games Store", id => `https://store.epicgames.com/p/${encodeURI(id)}`], ms: ["Microsoft Store", id => `https://apps.microsoft.com/detail/${encodeURI(id)}`],
 ps: ["PlayStation Store", id => `https://store.playstation.com/product/${encodeURI(id)}`], eshop: ["Nintendo eShop", id => `https://www.nintendo.com/us/store/products/${encodeURI(id)}/`]};
const SERVICES_NOMS = [["netflix", "Netflix"], ["prime", "Prime Video"], ["disney", "Disney+"], ["canal", "Canal+"], ["apple", "Apple TV+"], ["max", "Max"],
 ["paramount", "Paramount+"], ["crunchyroll", "Crunchyroll"], ["pc", "PC"], ["playstation", "PlayStation"], ["xbox", "Xbox"], ["switch", "Switch"], ["mac", "Mac"]];
const paysOffres = () => enAnglais() ? "US" : "FR";
// Plateformes d'un jeu : celles de Wikidata, complétées par les boutiques (une fiche PlayStation Store = jouable sur PlayStation)
const plateformesJeu = r => { const p = [...(r.plateformes || [])];
 if (r.boutiques?.ps && !p.some(x => x.startsWith("PS"))) p.push("PlayStation");
 if (r.boutiques?.eshop && !p.some(x => x.startsWith("Switch"))) p.push("Switch");
 return p; };
const mesServices = () => { try { return JSON.parse(localStorage.getItem("tastebridge-services")) || []; } catch { return []; } };
const chezMoi = r => WEB ? Moteur.chezMoi(r) : [];
// Ligne courte sous chaque carte : où regarder ou jouer, en vert si c'est sur un de tes services
const duree = r => !r.duree ? "" : r.dom === "jeu" ? `${r.duree < 1 ? "< 1" : Math.round(r.duree)} h` : `${Math.floor(r.duree / 60)} h ${String(r.duree % 60).padStart(2, "0")}`;
const badgeDuree = r => r.duree ? `<small class="duree">${ico("horloge")}${duree(r)}</small>` : "";
// Filtres des recos : une pastille par critère, cumulables
const FILTRES = {court: ["Court", r => r.duree && (r.dom === "jeu" ? r.duree <= 10 : r.duree <= 100)], gratuit: ["Gratuit", r => r.gratuit, "jeu"],
 plusieurs: ["À plusieurs", r => r.modes, "jeu"], ecran: ["Même écran", r => r.modes?.includes("ecran"), "jeu"]};
let filtresOn = new Set();
const garde = r => [...filtresOn].every(k => FILTRES[k][1](r));
function basculerFiltre(k){ filtresOn.has(k) ? filtresOn.delete(k) : filtresOn.add(k); rendre(); }
const barreFiltres = dom => `<div class="filtres">${Object.entries(FILTRES).filter(([, f]) => !f[2] || f[2] === dom).filter(([k]) => k !== "court" || dom !== "serie")
 .map(([k, [nom]]) => `<button class="${filtresOn.has(k) ? "on" : ""}" aria-pressed="${filtresOn.has(k)}" onclick="basculerFiltre('${k}')">${k === "court" ? ico("horloge") : ""}${nom}</button>`).join("")}</div>`;
function ouCourt(r){
 const liste = r.dom === "jeu" ? plateformesJeu(r) : r.dispo?.[paysOffres()]?.abo || [];
 if (!liste.length) return "";
 const moi = chezMoi(r).length > 0;
 return `<p class="ou">${ico("ecran")}${moi ? "<b>Chez toi</b> : " : ""}${liste.slice(0, 3).map(esc).join(", ")}</p>`;
}
function blocOu(r){
 // Une offre ou une plateforme que tu as (réglage « Mes services ») ressort en vert
 const marque = n => WEB && Moteur.chezMoi(r.dom === "jeu" ? {dom: "jeu", plateformes: [n]} : {dom: r.dom, dispo: {[Moteur.pays()]: {abo: [n]}}}).length ? " mien" : "";
 if (r.dom === "jeu") {
  const pl = plateformesJeu(r);
  const b = [["steam", r.steam], ...Object.entries(r.boutiques || {})].filter(([k, id]) => id && BOUTIQUES[k]);
  return `${pl.length ? `<div class="chips">${pl.map(x => `<span class="chip${marque(x)}">${esc(x)}</span>`).join("")}</div>` : `<p class="aide">Plateformes non disponibles.</p>`}
   <div class="boutiques">${b.map(([k, id]) => `<a class="bt" href="${esc(BOUTIQUES[k][1](id))}" target="_blank" rel="noopener">${ico("lien")}${BOUTIQUES[k][0]}</a>`).join("")}</div>`;
 }
 const jw = enAnglais() ? `https://www.justwatch.com/us/search?q=${encodeURIComponent(r.titre)}` : `https://www.justwatch.com/fr/recherche?q=${encodeURIComponent(r.titre)}`;
 return `<p class="aide">Les offres de streaming changent souvent : JustWatch les tient à jour.</p>
  <a class="bt" href="${jw}" target="_blank" rel="noopener">${ico("lien")}Toutes les offres sur JustWatch</a>`;
}
function reglerServices(k){
 const l = mesServices(), i = l.indexOf(k); if (i < 0) l.push(k); else l.splice(i, 1);
 try { localStorage.setItem("tastebridge-services", JSON.stringify(l)); } catch {}
 data = null; document.querySelectorAll(`.services [data-k="${k}"]`).forEach(b => b.setAttribute("aria-pressed", i < 0));
}

// Fiche d'une œuvre : une page entière à son adresse (#/film/ID), voir fichePage()
const lienFiche = (r, ancre) => `#/${r.dom}/${encodeURIComponent(r.id)}${ancre ? "/" + ancre : ""}`;
// Moyennes des avis de tout le monde (compte.js remplit window.NOTES : id -> [moyenne, nombre])
const etoile = r => { const n = window.NOTES?.[r.id]; return n ? `<a class="moy" href="${lienFiche(r, "avis")}" title="Voir les avis"><span class="vh">Moyenne des visiteurs :</span>${ico("etoile")}${decimal(n[0])}</a>` : ""; };
// Tri : des recos (onglets) et des listes thème / ambiance / année. Un titre sans la donnée passe après, jamais de note inventée.
// Note critique : Metacritic, sinon Rotten Tomatoes, sinon avis Steam (mêmes règles dans moteur.js et recos.py)
const noteCritique = r => r.metacritic ?? r.rt ?? (r.avis ? parseInt(r.avis) : null);
const CLES_TRI = {critique: noteCritique, recents: r => r.annee <= new Date().getFullYear() ? r.annee : null, tendance: r => WEB ? Moteur.tendance(r.id) || null : null,
 note: r => { const n = window.NOTES?.[r.id]; return n ? n[0] + n[1] / 1e6 : null; }};
const TRIS = {toi: "Pour toi", acclames: "Acclamés", critique: "Critique", recents: "Récents", tendance: "Tendance", note: "Visiteurs"};
const AIDE_TRI = {critique: "Metacritic, sinon Rotten Tomatoes, sinon avis Steam", tendance: "Les plus lus sur Wikipédia ou joués sur Steam cette semaine", note: "Moyenne des avis des visiteurs"};
let tri = "toi"; try { tri = localStorage.getItem("tastebridge-tri") || "toi"; } catch {}
if (!(tri in TRIS) || tri === "acclames") tri = "toi";
const trier = l => { const f = CLES_TRI[tri]; if (!f) return l;
 return l.map((r, k) => [f(r) ?? -Infinity, k, r]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
function choisirTri(k){ tri = k; try { localStorage.setItem("tastebridge-tri", k); } catch {} rendre(); }
const segmentsTri = (cles, actif, fn) => `<div class="segments tri" role="radiogroup" aria-label="Trier">${cles.map(k => `<button role="radio" aria-checked="${k === actif}" class="${k === actif ? "on" : ""}"${AIDE_TRI[k] ? ` title="${AIDE_TRI[k]}"` : ""} onclick="${fn}('${k}')">${TRIS[k]}</button>`).join("")}</div>`;
const barreTri = () => segmentsTri(WEB ? ["toi", "critique", "recents", "tendance", "note"] : ["toi", "critique", "recents"], tri, "choisirTri");
addEventListener("notes-moyennes", () => {
 if (vue === "fiche" && $("#notes")) $("#notes").innerHTML = notesExternes(FICHE);  // avis Pontil arrivés après coup
 if (vue !== "onglet" || !data || onglet === "gouts") return;
 const de = $("#res-de")?.innerHTML, y = scrollY;  // un nouveau rendu ne doit pas effacer le dé ni faire sauter la page
 rendre(); if (de && $("#res-de")) $("#res-de").innerHTML = de; scrollTo(0, y);
});
function boutonAvis(r, cls = "a5", texte = ""){
 return `<a class="${cls}" href="${lienFiche(r, WEB ? "avis" : "")}" title="Fiche et avis"${texte ? "" : ` aria-label="Fiche et avis : ${esc(r.titre)}"`}>${ico("bulle")}${texte}</a>`;
}
function carte(r){
 return `<article class="c" id="c-${r.id}" data-n="">
  <div class="cadre">
   <button class="couvre" onclick="ouvrir(this)" aria-expanded="false" aria-label="Donner ton avis : ${esc(r.titre)}">${couverture(r)}</button><span class="coche"></span>${palette(r.id)}${boutonAVoir(r.id)}
   ${r.match != null ? `<a class="pct" href="${lienFiche(r, "score")}" title="D'où vient ce score"><span class="vh">Correspondance :</span><span class="mini-anneau" style="--p:${r.match}"></span>${r.match} %</a>` : ""}${etoile(r)}
  </div>
  <div class="legende"><a class="titre" data-apercu="${r.id}" href="${lienFiche(r)}">${esc(r.titre)}</a><span><span><span class="type-c">${NOM[r.dom]}, </span>${lienAnnee(r.annee)}${r.annee ? ", " : ""}${r.themes?.[0] ? `<a class="point-theme" style="--h:${teinte(r.themes[0])}" href="${lienListe("theme", r.themes[0])}">${esc(r.themes[0])}</a>` : NOM[r.dom]}</span>${badgeDuree(r)}${r.gratuit ? `<small class="gratuit">Gratuit</small>` : ""}</span>
   <span class="pop-etat"></span></div>
 </article>`;
}

// Trois propositions volontairement différentes : la plus proche, une voisine d'une autre saga, un pari d'un autre style
function choisirTrio(l1, l2){
 const un = l1[0] || l2[0]; if (!un) return [];
 const autre = (r, l) => r.franchise !== un.franchise && !l.some(x => x.franchise && x.franchise === r.franchise);
 const deux = l1.slice(1, 25).find(r => autre(r, [un]) && r.themes[0] !== un.themes[0]) || l1.slice(1).find(r => autre(r, [un]));
 const pris = [un, deux].filter(Boolean);
 // Le pari vient d'abord de l'autre support (D'après tes jeux / tes films) : il plaît pour une autre raison
 const loin = r => !pris.some(x => x.id === r.id) && autre(r, pris) && !r.themes.some(t => un.themes.includes(t));
 const trois = l2.find(loin) || l1.slice(5).find(loin) || l2.find(r => !pris.some(x => x.id === r.id));
 return [[un, "Le plus proche"], [deux, "Dans le même esprit"], [trois, "Un pari"]].filter(([r]) => r);
}
function trio(l){
 const b = (r, note, icone, texte) => `<button class="bt" onclick="noter('${r.id}','${note}')" title="${texte}" aria-label="${texte}">${ico(icone)}</button>`;
 return `<section class="trio">${l.map(([r, role], k) => `<article class="prop" id="c-${r.id}"${visuel(r) ? ` style="--img:url('${esc(visuel(r))}')"` : ""}>
  <a class="prop-aff" href="${lienFiche(r)}" tabindex="-1" aria-hidden="true">${couverture(r, "eager")}</a>
  <div class="prop-texte">
   <span class="prop-role">${role}<b><span class="mini-anneau" style="--p:${r.match}"></span>${r.match} %</b></span>
   <h2><a href="${lienFiche(r)}" data-apercu="${r.id}">${esc(r.titre)}</a></h2>
   <small>${NOM[r.dom]}${r.annee ? `, ${r.annee}` : ""}</small>
   ${raisons(r)}
   <div class="prop-act">${AVIS.map(([n, i, t]) => b(r, n, i, t)).join("")}</div>
  </div></article>`).join("")}</section>`;
}
// La meilleure reco de l'onglet, en grand, sur un fond flouté tiré de son image
function scene(r){
 const b = (cls, note, icone, texte) => `<button class="bt ${cls}" onclick="noter('${r.id}','${note}')">${ico(icone)}${texte}</button>`;
 return `<section class="scene" id="c-${r.id}"${visuel(r) ? ` style="--img:url('${esc(visuel(r))}')"` : ""}>
  <div class="texte">
   <span class="etiquette"><i></i>Notre meilleur choix pour toi, ${r.match} %</span>
   <h2 class="${r.titre.length > 26 ? "long" : ""}"><a href="${lienFiche(r)}">${esc(r.titre)}</a><span>${lienAnnee(r.annee)}</span></h2>
   ${raisons(r)}
   <div class="chips">${r.themes.map(t => pastille(t)).join("")}${ambiances(r.themes).map(t => chip(t, "ambiance")).join("")}</div>
   ${r.avis ? `<div class="avis">${esc(r.avis)}</div>` : ""}
   <div class="actions">${AVIS.map(([k, i, t]) => b("", k, i, t)).join("")}</div>
   <div class="actions secondaires">${boutonAvis(r, "bt discret", "Fiche et avis")}<a class="bt discret" href="${lien(r)}" target="_blank" rel="noopener">${ico("lien")}${r.steam ? "Sur Steam" : "En savoir plus"}</a></div>
  </div>
  <a class="affiche" href="${lienFiche(r)}" tabindex="-1" aria-hidden="true">${couverture(r, "eager").replace("<img ", '<img fetchpriority="high" ')}</a>
 </section>`;
}

// compte.js a fusionné les notes du compte : on recalcule tout
addEventListener("profil-recharge", () => { data = null; compter(); if (vue === "onglet") rendre(); else if (vue === "fiche" || vue === "listes") router(); else if (vue === "accueil") accueil(); });
function rendre(){
 if (vue !== "onglet") return;
 const m = $("#main");
 if (onglet === "gouts") return gouts();
 m.className = onglet;
 if (!data){ m.innerHTML = `<div class="scene chargement"></div><div class="section"><div class="grille">${'<div class="squelette"></div>'.repeat(12)}</div></div>`; charger(); return; }
 const [[t1, l1t], [t2, l2t]] = data[onglet], l1 = l1t.filter(garde), l2 = l2t.filter(garde);
 // Vedette : la meilleure reco du même support, sinon celle tirée de l'autre support (avant : message « pas assez » alors que la grille était pleine)
 const trois = choisirTrio(l1, l2), tete = trois[0]?.[0], vus = new Set(trois.map(([r]) => r.id)), reste = [...l1, ...l2].filter(r => !vus.has(r.id) && vus.add(r.id));
 const tries = trier(reste); dispo = tries.length;
 const vide = filtresOn.size && (l1t.length || l2t.length) ? `<div class="vide">${ico(ICONE[onglet])}<span>Rien avec ces filtres.</span></div>`
  : `<div class="vide">${ico(ICONE[onglet])}<span>${WEB && !Moteur.aimes().length ? "Il suffit d'un titre noté J'aime ou J'adore (Sans plus et Non merci ne comptent pas)." : "Rien d'assez proche de tes goûts ici pour l'instant."} <a href="#/gouts">Ajoute quelques titres</a> et les recos apparaissent.</span></div>`;
 // Sans goûts : on montre les incontournables à noter plutôt qu'un message
 const sansGouts = WEB && !tete && !filtresOn.size && !Moteur.aimes().length;
 m.innerHTML = `<h1 class="vh">${TITRE_ONGLET[onglet]}</h1>${tete ? trio(trois) : sansGouts ? `<section class="section rang rang-${onglet}"><div class="tete"><h2>${ico(ICONE[onglet])}Les incontournables</h2></div><div class="grille">${Moteur.populaires(onglet, 60).filter(x => x.image).slice(0, 30).map(carte).join("")}</div></section>` : `<div class="section">${vide}</div>`}
  ${reste.length ? `<section class="section"><div class="tete"><h2>${TITRE_ONGLET[onglet]}</h2>${barreTri()}</div>${barreFiltres(onglet)}<div class="grille" id="grille-recos">${tries.slice(0, voir[onglet]).map(carte).join("")}</div>
   ${tries.length > voir[onglet] || (WEB && !fin[onglet] && taille < 400) ? `<div class="plus"><button class="bt" id="plus-recos" onclick="plusRecos()">${ico(ICONE[onglet])}${PLUS[onglet]}</button></div>` : ""}</section>` : ""}
  ${WEB ? railTendances(onglet) : ""}
  ${WEB && tete ? zoneDe() : ""}`;
 guetteur?.disconnect(); const bp = $("#plus-recos"); if (bp) guetteur?.observe(bp);
 appliquerDefile();
}

// En ce moment : tendances de la semaine (Wikipédia, Steam), celles qui te ressemblent d'abord
const TITRE_ONGLET = {film: "Films pour toi", serie: "Séries pour toi", jeu: "Jeux pour toi"};
function railTendances(dom){
 const l = Moteur.tendances(dom, 20).filter(x => vue !== "accueil" || !montres.has(x.id)).slice(0, 12);  // sur l'accueil : pas un titre déjà montré plus haut
 if (vue === "accueil") l.forEach(x => montres.add(x.id));
 return l.length ? `<section class="section rang rang-${dom}"><div class="tete"><h2>En ce moment : ${{film: "films", serie: "séries", jeu: "jeux"}[dom]}</h2></div>
  <div class="rail rail-cartes">${l.map(carte).join("")}</div>${vue === "accueil" && l.length > 12 ? VOIR_PLUS : ""}</section>` : "";

  const d = new DOMParser().parseFromString(html, "text/html");

  <div class="actions"><button class="bt plein" id="partager">${ico("partage")}Partager</button>${k < 0 ? `<button class="bt" id="garder">${ico("liste")}Garder dans mes listes</button>` : ""}</div></div>
  ${t.length ? `<div class="grille">${t.map(x => `<div class="dans-liste">${k >= 0 ? `<button class="retirer" aria-label="Retirer ${esc(x.titre)}" onclick="retirerDeListe(${k}, '${x.id}')">×</button>` : ""}${carte(x)}</div>`).join("")}</div>`
   : `<div class="vide">${ico("liste")}<span>Cette liste est vide. Ajoute des titres depuis leur fiche.</span></div>`}</section>`;
 $("#partager").onclick = () => partagerListe(l);
 if ($("#garder")) $("#garder").onclick = () => { const ls = lireListes(); ls.push({...l, cree: Date.now()}); ecrireListes(ls); toast("Liste gardée"); listePartagee(titre, ids); };
 appliquerDefile();
}
function retirerDeListe(k, id){ const l = lireListes(); if (!l[k]) return; l[k].items = l[k].items.filter(x => x !== id); ecrireListes(l); history.replaceState(null, "", lienPartage(l)); router(); }

// ---------- Navigation par adresse : #/film, #/serie, #/jeu, #/gouts, #/film/ID[/ancre] ----------
// Retour et Suivant du navigateur marchent, chaque page est partageable, la position est retrouvée au retour.
const ONGLETS = ["film", "serie", "jeu", "gouts"], DEFILE = {};
let vue = "", interne = false, interneAncre = false, defile = null, titrePage = "";
try { history.scrollRestoration = "manual"; } catch {}
// Un clic sur un lien interne (même onglet) ouvre la page en haut ; Retour, Suivant ou un lien collé retrouvent la position
addEventListener("click", e => { const a = e.target.closest?.('a[href^="#/"]'); if (a && !e.defaultPrevented && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) interne = true; }, true);
addEventListener("scroll", () => { DEFILE[location.hash] = scrollY; }, {passive: true});
function appliquerDefile(){ if (defile !== null) { scrollTo(0, defile); defile = null; } }
function marquerNav(o){ document.querySelectorAll("nav button").forEach(x => { x.classList.toggle("on", x.dataset.o === o); x.setAttribute("aria-current", x.dataset.o === o ? "page" : "false"); }); }
function fermerCalques(){ document.querySelectorAll(".fond-recherche,.voile-compte").forEach(e => e.remove()); document.body.style.overflow = ""; }
function router(){
 const [, a = "", b, c] = location.hash.split("/");
 titrePage ||= document.title;
 fermerCalques();
 interneAncre = interne; defile = interne ? 0 : (DEFILE[location.hash] ?? 0); interne = false;
 if (b && NOM[a]) return fichePage(a, decodeURIComponent(b), c);
 document.title = titrePage;
 if (["theme", "ambiance", "annee"].includes(a) && b) return listePage(a, decodeURIComponent(b));
 if (a === "l" && b) return listePartagee(decodeURIComponent(b), (c || "").split(".").filter(Boolean).map(decodeURIComponent));
 if (a === "listes") return mesListes();
 if (a === "mentions") return mentions();
 if (a === "accueil") { marquerNav(null); accueil(); return appliquerDefile(); }
 if (ONGLETS.includes(a)) { vue = "onglet"; onglet = a; marquerNav(a); return rendre(); }
 if (WEB && nbNotes < 5) { marquerNav(null); accueil(); return appliquerDefile(); }  // premier passage
 history.replaceState(null, "", "#/film"); router();
}
function aller(o){ interne = true; if (location.hash === "#/" + o) router(); else location.hash = "#/" + o; }
addEventListener("hashchange", router);
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) aller(b.dataset.o); };
if (WEB) {
 // Premier passage : le texte d'accueil s'affiche tout de suite, le catalogue (1,3 Mo) arrive pendant ce temps
 let n0 = 0; try { n0 = Object.keys(JSON.parse(localStorage.getItem("tastebridge-profil"))?.notes || {}).length; } catch {}
 if (n0 < 5 && !/^#\/./.test(location.hash)) accueil(false);
 Moteur.charger().then(async () => { await compter(); router(); });
}
else { setInterval(()=>fetch("/api/ping").catch(()=>{}), 10000); compter().then(router); }
</script>
